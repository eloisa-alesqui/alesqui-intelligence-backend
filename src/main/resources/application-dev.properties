# Development profile — overrides for local development
# Activate with: SPRING_PROFILES_ACTIVE=dev (in .env or JVM arg)

# CORS: allow localhost origins for local frontend and backend
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000},${CORS_ADDITIONAL_ORIGINS:http://localhost:8080}

# Logging: more verbose for development
logging.level.es.alesqui.intelligence=INFO
logging.level.org.springframework=WARN
