# =============================================================================
# Alesqui Intelligence Application Configuration
# NON-SENSITIVE SETTINGS ONLY - All secrets are in .env file
# =============================================================================

# =============================================================================
# SERVER CONFIGURATION
# =============================================================================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

# =============================================================================
# SPRING APPLICATION CONFIGURATION
# =============================================================================
spring.application.name=alesquiintelligence
spring.main.web-application-type=reactive
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.servlet.WebMvcAutoConfiguration

# =============================================================================
# MONGODB CONFIGURATION (Non-sensitive settings)
# =============================================================================
# Note: MONGODB_URI comes from .env file and includes credentials
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:postmangpt}
spring.data.mongodb.username=${MONGODB_USER:#{null}}
spring.data.mongodb.password=${MONGODB_PASSWORD:#{null}}
spring.data.mongodb.authentication-database=${MONGODB_AUTH_DB:admin}
spring.data.mongodb.auto-index-creation=${MONGODB_AUTO_INDEX:true}

# MongoDB Embedded Configuration (for development/testing)
spring.mongodb.embedded.version=4.4.18

# MongoDB Connection Pool Settings
spring.mongodb.connection.pool.max-size=20
spring.mongodb.connection.pool.min-size=5
spring.mongodb.connection.pool.max-wait-time=120000
spring.mongodb.connection.pool.max-connection-idle-time=0
spring.mongodb.connection.pool.max-connection-life-time=0

# =============================================================================
# AI AND VECTOR STORE CONFIGURATION
# =============================================================================
# Vector Store Configuration
#spring.ai.vectorstore.mongodb.collection-name=vector_embeddings
#spring.ai.vectorstore.mongodb.path-name=embedding
#spring.ai.vectorstore.mongodb.metadata-field-name=metadata

# OpenAI Configuration (API key comes from .env)
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=https://api.openai.com
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.chat.options.max-tokens=2048
spring.ai.tools.observations.include-content=true

# =============================================================================
# REDIS CACHE CONFIGURATION
# =============================================================================

spring.redis.enabled=false

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# Redis Connection Configuration (host and password from .env)
spring.redis.host=${REDIS_HOST}
spring.redis.port=6379
spring.redis.password=${REDIS_PASSWORD}
spring.redis.database=0
spring.redis.timeout=2000ms

# Redis Connection Pool (Lettuce)
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

# =============================================================================
# WEBFLUX CONFIGURATION
# =============================================================================
spring.webflux.base-path=
spring.netty.leak-detection=simple
spring.codec.max-in-memory-size=10MB

# WebFlux Multipart Configuration
spring.webflux.multipart.max-in-memory-size=1MB
spring.webflux.multipart.max-disk-usage-per-part=10MB
spring.webflux.multipart.max-parts=128

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================
# JWT Configuration (secret comes from .env)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
# Log Levels
logging.level.es.alesqui.intelligence=WARN
#logging.level.es.alesqui.intelligence.security=DEBUG
#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework.data.mongodb=DEBUG
#logging.level.org.springframework.ai=DEBUG
#logging.level.org.springframework.cache=DEBUG
#logging.level.org.springframework.web=INFO
#logging.level.org.springframework.webflux=DEBUG
#logging.level.es.alesqui.intelligence=DEBUG
#logging.level.org.springframework.http=DEBUG
#logging.level.org.springframework.web=DEBUG
#logging.level.reactor.netty.http.client=DEBUG
#logging.level.sun.net.www.protocol.http=DEBUG
#logging.level.sun.net.www.protocol.https=DEBUG
#logging.level.org.springframework.http=DEBUG
#logging.level.org.apache.http=DEBUG
#logging.level.org.apache.http.wire=DEBUG
#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework.security.web.server.authorization=DEBUG

# Log Patterns
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Log File Configuration
logging.file.name=logs/alesquiintelligence.log
logging.file.max-size=10MB
logging.file.max-history=30

# =============================================================================
# ACTUATOR MANAGEMENT
# =============================================================================
# Endpoints Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus,mongodb
management.endpoints.web.base-path=/actuator

# Health Endpoint Configuration
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=always

# Metrics and Prometheus
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true

# Health Indicators
management.health.mongo.enabled=true
management.health.redis.enabled=true

# Prometheus Metrics Export
management.metrics.export.prometheus.enabled=true

# =============================================================================
# ALESQUI INTELLIGENCE APPLICATION SPECIFIC CONFIGURATION
# =============================================================================
# API Configuration
alesquiintelligence.api.max-requests-per-minute=100
alesquiintelligence.api.max-collection-size=1000
alesquiintelligence.api.max-request-size=10MB

# AI Features Configuration
alesquiintelligence.ai.enabled=true
alesquiintelligence.ai.max-suggestions=5
alesquiintelligence.ai.suggestion-cache-ttl=3600

# Storage Configuration
alesquiintelligence.storage.max-history-entries=1000
alesquiintelligence.storage.cleanup-interval=24h
alesquiintelligence.storage.backup-enabled=true
alesquiintelligence.storage.backup-schedule=0 2 * * *

# =============================================================================
# FILE SIZE LIMITS AND COLLECTION CONFIGURATION
# =============================================================================
# Collection Import Configuration
alesquiintelligence.collection.max-file-size=10485760
alesquiintelligence.collection.max-json-size=10485760
alesquiintelligence.collection.enable-duplicate-check=true
alesquiintelligence.collection.max-collections-per-user=50
alesquiintelligence.collection.allowed-file-types=json

# Legacy support (keeping your existing properties)
postman.collection.max-file-size=10485760
postman.collection.max-json-size=10485760

# =============================================================================
# HTTP CLIENT CONFIGURATION
# =============================================================================
# HTTP Client Timeouts
alesquiintelligence.http.connect-timeout=5000
alesquiintelligence.http.read-timeout=30000
alesquiintelligence.http.write-timeout=30000

# =============================================================================
# VALIDATION CONFIGURATION
# =============================================================================
# Request Validation
alesquiintelligence.validation.max-name-length=255
alesquiintelligence.validation.max-description-length=1000
alesquiintelligence.validation.require-collection-name=true

# =============================================================================
# PROXY CONFIGURATION
# =============================================================================
proxy.host=${PROXY_HOST}
proxy.port=${PROXY_PORT}

# =============================================================================
# CHAT SYSTEM CONFIGURATION
# Centralized configuration for the chat system.
# All configurations related to timeouts, limits and cache.
# =============================================================================

# -----------------------------------------------------------------------------
# TIMEOUT CONFIGURATIONS
# -----------------------------------------------------------------------------

# Timeout for query classification (Duration format: PT10S, 10s, etc.)
chat.classification-timeout=10s

# General timeout for chat processing
chat.processing-timeout=120s

# Timeout for operations without tools/APIs
chat.processing-direct-timeout=10s

# Timeout for operations with tools/APIs
chat.tools-timeout=120s

# Time threshold to show warnings (in milliseconds)
chat.timeout-warning=10000

# -----------------------------------------------------------------------------
# LIMITS AND THRESHOLDS
# -----------------------------------------------------------------------------

# Token threshold to show warnings
chat.tokens-warning=4000

# Maximum number of messages in conversation history
chat.max-conversation-history=20

# -----------------------------------------------------------------------------
# CACHE CONFIGURATION
# -----------------------------------------------------------------------------

# Cache time for classification prompts
chat.prompt-cache-time=5m

# -----------------------------------------------------------------------------
# REASONING FORMATTER CONFIGURATION
# Specific configurations for the reasoning formatter
# -----------------------------------------------------------------------------

# Timeout for reasoning formatting
chat.reasoning.formatting-timeout=30s

# Enable detailed reasoning formatting
chat.reasoning.enable-detailed-formatting=true

# -----------------------------------------------------------------------------
# AUTOMATIC CLEANUP CONFIGURATION
# Configurations for automatic cleanup
# -----------------------------------------------------------------------------

# Interval for cleaning up inactive conversations
chat.cleanup.cleanup-interval=5m

# Inactivity time before cleaning up a conversation
chat.cleanup.inactivity-threshold=1h

# Enable automatic cleanup
chat.cleanup.enable-auto-cleanup=true

# -----------------------------------------------------------------------------
# UTILITY AI CONFIGURATIONS
# -----------------------------------------------------------------------------
# Timeout for stateless, background AI tasks (e.g., summarization)
chat.utility-ai.timeout=20s

# ============================================================================
# FILE STORAGE CONFIGURATION
# ============================================================================
# Directory for temporary file uploads and generations.
# If commented out, defaults to the system's temp folder (e.g., /tmp or C:\Users\...\AppData\Local\Temp)
# Example for Linux/Mac: file-storage.temp-upload-dir=/var/data/alesqui-intelligence/temp
# Example for Windows: file-storage.temp-upload-dir=C:/apps/alesqui-intelligence/temp
alesquiintelligence.file-storage.temp-upload-dir=./temp-files