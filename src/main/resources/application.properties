# =============================================================================
# Alesqui Intelligence Application Configuration
# NON-SENSITIVE SETTINGS ONLY - All secrets are in .env file
# =============================================================================

# =============================================================================
# DEPLOYMENT CONFIGURATION
# =============================================================================
# Mode:  TRIAL (public trial at www.alesqui.com) or CORPORATE (self-hosted)
app.deployment.mode=TRIAL

# Company name for branding in emails and UI
# Note: COMPANY_NAME comes from .env file
app.deployment.company-name=${COMPANY_NAME:Alesqui Intelligence}

# =============================================================================
# SERVER CONFIGURATION
# =============================================================================
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

# =============================================================================
# SPRING APPLICATION CONFIGURATION
# =============================================================================
spring.application.name=alesquiintelligence
spring.main.web-application-type=reactive
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.servlet.WebMvcAutoConfiguration

# =============================================================================
# MONGODB CONFIGURATION (Non-sensitive settings)
# =============================================================================
# Note: MONGODB_URI comes from .env file and includes credentials
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:postmangpt}
spring.data.mongodb.username=${MONGODB_USER:#{null}}
spring.data.mongodb.password=${MONGODB_PASSWORD:#{null}}
spring.data.mongodb.authentication-database=${MONGODB_AUTH_DB:admin}
spring.data.mongodb.auto-index-creation=${MONGODB_AUTO_INDEX:true}

# =============================================================================
# AI CONFIGURATION
# =============================================================================
# OpenAI Configuration (API key comes from .env)
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=https://api.openai.com
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.chat.options.max-tokens=2048
spring.ai.tools.observations.include-content=true

# =============================================================================
# WEBFLUX CONFIGURATION
# =============================================================================
spring.webflux.base-path=

# WebFlux Multipart Configuration
spring.webflux.multipart.max-in-memory-size=1MB
spring.webflux.multipart.max-disk-usage-per-part=10MB
spring.webflux.multipart.max-parts=128

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================
# JWT Configuration (secret comes from .env)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:900000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS Configuration
# Note: FRONTEND_URL is the primary frontend URL (used in emails and CORS)
# Note: CORS_ADDITIONAL_ORIGINS is optional - add extra domains separated by commas if needed
# Example in .env:
#   FRONTEND_URL=https://yourdomain.com
#   CORS_ADDITIONAL_ORIGINS=https://yourapp.vercel.app,https://yourapp-staging.vercel.app
# For development, local URLs are always included
app.cors.allowed-origins=${FRONTEND_URL:https://intelligence.alesqui.com},${CORS_ADDITIONAL_ORIGINS:https://alesqui-intelligence.vercel.app},http://localhost:3000,http://localhost:8080
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers,X-Request-ID,X-Correlation-ID
app.cors.allow-credentials=true
app.cors.max-age=3600

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
# Log Levels
logging.level.es.alesqui.intelligence=ERROR
logging.level.org.springframework=ERROR
logging.level.com.mongodb=ERROR
logging.level.org.mongodb.driver=ERROR

# Log Patterns
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Log File Configuration
logging.file.name=logs/alesquiintelligence.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# =============================================================================
# ACTUATOR MANAGEMENT
# =============================================================================
# Endpoints Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus,mongodb
management.endpoints.web.base-path=/actuator

# Health Endpoint Configuration
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=always

# Metrics and Prometheus
management.endpoint.metrics.access=UNRESTRICTED
management.endpoint.prometheus.access=UNRESTRICTED

# Health Indicators
management.health.mongo.enabled=true

# Prometheus Metrics Export
management.prometheus.metrics.export.enabled=true

# =============================================================================
# ALESQUI INTELLIGENCE APPLICATION SPECIFIC CONFIGURATION
# =============================================================================
# Audit Log Retention Configuration
# Number of days to retain audit logs before automatic deletion (default: 730 days / 2 years)
# MongoDB TTL background task automatically removes expired audit logs every 60 seconds
# Minimum recommended: 90 days for compliance purposes
# Note: AUDIT_RETENTION_DAYS comes from .env file
audit.retention.days=${AUDIT_RETENTION_DAYS:730}

# =============================================================================
# FILE SIZE LIMITS AND COLLECTION CONFIGURATION
# =============================================================================
# Maximum file size for uploads (in bytes)
postman.collection.max-file-size=10485760
postman.collection.max-json-size=10485760

# =============================================================================
# PROXY CONFIGURATION
# =============================================================================
# If environment variables are missing, fall back to safe defaults (no proxy)
# Empty host disables proxy; port 0 is treated as disabled by HttpClientConfig
proxy.host=${PROXY_HOST:}
proxy.port=${PROXY_PORT:0}

# =============================================================================
# CHAT SYSTEM CONFIGURATION
# Centralized configuration for the chat system.
# All configurations related to timeouts, limits and cache.
# =============================================================================

# -----------------------------------------------------------------------------
# TIMEOUT CONFIGURATIONS
# -----------------------------------------------------------------------------

# General timeout for chat processing
chat.processing-timeout=120s

# Timeout for operations with tools/APIs
chat.tools-timeout=120s

# Time threshold to show warnings (in milliseconds)
chat.timeout-warning=10000

# Timeout for stateless, background AI tasks (e.g., summarization)
chat.utility-ai.timeout=20s

# -----------------------------------------------------------------------------
# LIMITS AND THRESHOLDS
# -----------------------------------------------------------------------------

# Token threshold to show warnings
chat.tokens-warning=4000

# Maximum number of messages in conversation history
chat.max-conversation-history=20

# -----------------------------------------------------------------------------
# REASONING FORMATTER CONFIGURATION
# Specific configurations for the reasoning formatter
# -----------------------------------------------------------------------------

# Timeout for reasoning formatting
chat.reasoning.formatting-timeout=30s

# Enable detailed reasoning formatting
chat.reasoning.enable-detailed-formatting=true

# -----------------------------------------------------------------------------
# AUTOMATIC CLEANUP CONFIGURATION
# Configurations for automatic cleanup
# -----------------------------------------------------------------------------

# Interval for cleaning up inactive conversations
chat.cleanup.cleanup-interval=5m

# Inactivity time before cleaning up a conversation
chat.cleanup.inactivity-threshold=1h

# Enable automatic cleanup
chat.cleanup.enable-auto-cleanup=true

# ============================================
# SMTP / EMAIL CONFIGURATION
# ============================================
# SMTP server host (empty by default, set via environment variable for production)
spring.mail.host=${SMTP_HOST}

# SMTP port
spring.mail.port=${SMTP_PORT}

# SMTP user (Brevo login)
spring.mail.username=${SMTP_USER}

# SMTP password (Brevo key)
spring.mail.password=${SMTP_PASSWORD}

# Additional SMTP properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_HOST}
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Default sender configuration
mail.from.email=${MAIL_FROM_EMAIL:noreply@alesqui.com}
mail.from.name=${MAIL_FROM_NAME:Alesqui Intelligence}

# Frontend URL for email links
frontend.url=${FRONTEND_URL:https://intelligence.alesqui.com}

# =============================================================================
# TRIAL USER CONFIGURATION
# =============================================================================
# Trial duration in days (how long trial users have access)
trial.duration.days=${TRIAL_DURATION_DAYS:14}
# Rate limiting for trial registration
# Time window in hours for rate limiting
trial.rate-limit.window-hours=${TRIAL_RATE_LIMIT_WINDOW_HOURS:24}
# Maximum registration attempts per IP within the time window
trial.rate-limit.max-attempts=${TRIAL_RATE_LIMIT_MAX_ATTEMPTS:1}
