# MongoDB engine version
de.flapdoodle.mongodb.embedded.version=4.0.2

# Override MongoDB URI for tests so flapdoodle can redirect it to its embedded instance.
# Flapdoodle replaces this with mongodb://localhost:{random-port}/{database} at startup.
spring.data.mongodb.uri=mongodb://localhost:27017

# Logging for tests
#logging.level.org.springframework.data.mongodb=INFO
#logging.level.org.springframework.test=INFO
#logging.level.de.flapdoodle.embed.mongo=DEBUG
#logging.level.org.springframework.boot.autoconfigure.mongo.embedded=DEBUG
#logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
#logging.level.org.mongodb.driver=DEBUG
logging.level.es.alesqui.intelligence=DEBUG
logging.level.org.springframework.ai=DEBUG

# OAuth2 Google tokeninfo URL overridden in individual tests via @DynamicPropertySource
# app.oauth2.google.tokeninfo-url=http://localhost:{wiremock-port}/tokeninfo
app.oauth2.google.client-id=test-client-id
app.oauth2.google.enabled=true

# Use gpt-3.5-turbo for tests (cheaper)
spring.ai.openai.chat.options.model=gpt-3.5-turbo
# Limit tokens to reduce costs
spring.ai.openai.chat.options.max-tokens=150



