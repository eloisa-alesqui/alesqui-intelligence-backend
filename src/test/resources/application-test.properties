# Embedded MongoDB for tests
spring.data.mongodb.uri=mongodb://localhost:27017/test-postman-gpt
spring.data.mongodb.database=test-postman-gpt

# MongoDB engine version 
de.flapdoodle.mongodb.embedded.version=4.0.2

# Logging for tests
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.test=INFO
logging.level.de.flapdoodle.embed.mongo=DEBUG
logging.level.org.springframework.boot.autoconfigure.mongo.embedded=DEBUG

# Disable ALL AI features completely
spring.ai.enabled=false
spring.ai.openai.enabled=false
spring.ai.openai.chat.enabled=false
spring.ai.openai.embedding.enabled=false
spring.ai.openai.image.enabled=false
spring.ai.openai.api-key=fake-test-key-not-real

# Exclude OpenAI auto-configurations
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration,org.springframework.ai.autoconfigure.openai.OpenAiChatAutoConfiguration,org.springframework.ai.autoconfigure.openai.OpenAiEmbeddingAutoConfiguration,org.springframework.ai.autoconfigure.openai.OpenAiImageAutoConfiguration
