# Ollama test profile — activates Ollama provider instead of OpenAI
spring.ai.model.chat=ollama

# MongoDB engine version
de.flapdoodle.mongodb.embedded.version=4.0.2

# Override MongoDB URI for tests so flapdoodle can redirect it to its embedded instance.
spring.data.mongodb.uri=mongodb://localhost:27017

# Logging
logging.level.es.alesqui.intelligence=DEBUG
logging.level.org.springframework.ai=DEBUG

# OAuth2 Google (test defaults)
app.oauth2.google.client-id=test-client-id
app.oauth2.google.enabled=true

# Defaults for required properties so @SpringBootTest can start without full .env
app.jwt.secret=test-jwt-secret-that-is-at-least-32-characters-long
spring.mail.host=localhost
spring.mail.port=587
spring.mail.username=test@test.com
spring.mail.password=test-password
